stages:
  - build

image: ubuntu:22.04

variables:
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"

cache:
  key: "flutter-android-$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - .pub-cache/
    - build/
  policy: pull-push

android_debug_apk:
  stage: build
  # ✅ Run only on the dev branch (or MRs targeting dev)
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'

  before_script:
    - bash -lc '
        set -Eeuo pipefail; set -x;
        mkdir -p ci-debug;

        on_error() {
          local line="$1";
          echo "❌ CI FAILED at line ${line}";
          echo "Last command: ${BASH_COMMAND}";
          # Snapshot environment & trees
          env | sort > ci-debug/env.txt || true;
          uname -a > ci-debug/uname.txt || true;
          # Show Android SDK layout & installed packages
          ls -R "$ANDROID_SDK_ROOT" > ci-debug/android-sdk-tree.txt 2>&1 || true;
          command -v sdkmanager && sdkmanager --list > ci-debug/sdkmanager-list.txt 2>&1 || true;
          # Flutter/Gradle diags
          command -v flutter && flutter doctor -v > ci-debug/flutter-doctor-post.txt 2>&1 || true;
          [ -d android ] && (cd android && ./gradlew -v > ../ci-debug/gradle-version.txt 2>&1 || true);
          # Build outputs if any
          ls -R build > ci-debug/build-tree.txt 2>&1 || true;
          # Grab *.log files if exist
          find . -maxdepth 4 -type f -name "*.log" -print -exec sh -c "echo ==== {} ====; sed -n \"1,200p\" \"{}\"" \; > ci-debug/log-snippets.txt 2>&1 || true;
        }
        trap '\''on_error $LINENO'\'' ERR
      '

    # ---- Basics & JDK ----
    - apt-get update -y
    - apt-get install -y --no-install-recommends curl unzip git xz-utils zip ca-certificates openjdk-17-jdk libglu1-mesa
    - java -version | tee ci-debug/java-version.txt

    # ---- Android SDK: cmdline-tools correctly placed ----
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
    - unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
    - mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
    - rm -f /tmp/cmdtools.zip
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - which sdkmanager | tee ci-debug/which-sdkmanager.txt
    - sdkmanager --version | tee ci-debug/sdkmanager-version.txt

    # Accept licenses & install platform/build-tools
    - yes | sdkmanager --licenses
    - sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
    - sdkmanager --list | tee ci-debug/sdkmanager-list.txt

    # ---- Flutter (stable) ----
    - git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$CI_PROJECT_DIR/flutter"
    - export PATH="$CI_PROJECT_DIR/flutter/bin:$PATH"
    - flutter --version | tee ci-debug/flutter-version.txt
    - flutter config --no-analytics
    - flutter precache --android
    - flutter doctor -v | tee ci-debug/flutter-doctor-pre.txt

    # ---- Ensure Gradle sees the SDK ----
    - mkdir -p android
    - printf "sdk.dir=%s\n" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties
    - cat android/local.properties | tee ci-debug/local-properties.txt

    # Helpful Gradle defaults (append if not present)
    - |
      echo "org.gradle.jvmargs=-Xmx4096m -Dkotlin.daemon.jvm.options=-Xmx2048m" >> android/gradle.properties
      echo "android.useAndroidX=true" >> android/gradle.properties
      echo "android.enableJetifier=true" >> android/gradle.properties
    - cat android/gradle.properties | tee ci-debug/gradle-properties.txt

    # Gradle wrapper sometimes loses +x bit in CI
    - chmod +x android/gradlew || true
    - (cd android && ./gradlew -v) | tee ci-debug/gradle-version.txt

    # ---- Dependencies ----
    - flutter pub get

  script:
    - bash -lc '
        set -Eeuo pipefail; set -x;

        # Pass dart-defines from CI vars if present
        EXTRA_DEFINES=()
        [ -n "${SUPABASE_URL:-}" ] && EXTRA_DEFINES+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
        [ -n "${SUPABASE_ANON_KEY:-}" ] && EXTRA_DEFINES+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")

        # Build (verbose). If it fails, the ERR trap collects diagnostics.
        flutter build apk -v --debug --no-shrink "${EXTRA_DEFINES[@]}"

        # Snapshot outputs on success too
        ls -R build > ci-debug/build-tree.txt 2>&1 || true
        flutter doctor -v > ci-debug/flutter-doctor-post.txt 2>&1 || true
      '

  artifacts:
    when: always         # ✅ upload even on failure
    expire_in: 7 days
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/apk/debug/app-debug.apk
      - ci-debug/
