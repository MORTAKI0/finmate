stages:
  - build

image: ghcr.io/cirruslabs/flutter:stable-android

variables:
  ANDROID_HOME: "/opt/android-sdk"
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

cache:
  key: "flutter-android-$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - .pub-cache/
    - build/
  policy: pull-push

android_debug_apk:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH           # run on any branch push
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - flutter --version
    - flutter config --no-analytics
    - flutter doctor -v

    # Make sure Gradle/AGP can locate the SDK
    - mkdir -p android
    - printf "sdk.dir=%s\n" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties
    - cat android/local.properties

    # Helpful Gradle defaults (safe if file already exists)
    - |
      echo "org.gradle.jvmargs=-Xmx4096m -Dkotlin.daemon.jvm.options=-Xmx2048m" >> android/gradle.properties
      echo "android.useAndroidX=true" >> android/gradle.properties
      echo "android.enableJetifier=true" >> android/gradle.properties

    # Ensure Gradle wrapper is executable (sometimes loses +x)
    - chmod +x android/gradlew || true

    - flutter pub get

  script:
    # Pass dart-defines if CI variables are present
    - |
      EXTRA_DEFINES=()
      if [ -n "$SUPABASE_URL" ]; then EXTRA_DEFINES+=("--dart-define=SUPABASE_URL=$SUPABASE_URL"); fi
      if [ -n "$SUPABASE_ANON_KEY" ]; then EXTRA_DEFINES+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"); fi

      # Build Debug APK
      flutter build apk --debug --no-shrink "${EXTRA_DEFINES[@]}"

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/apk/debug/app-debug.apk
